<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Task Flow</h1>
        <p>Smart Task Management System</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to Task Flow</h2>
            <p>Organize your tasks and improve your productivity.</p>
        </section>
        <section class="dashboard">
    <h2>Task Dashboard</h2>

    <div class="stats">
        <div class="stat-card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
        </div>
    </div>
</section>

        <section class="task-section">
            <h2>My Tasks</h2>

            <div class="task-input">
                <input type="text" id="taskInput"
                       placeholder="Enter your task">

                <button onclick="addTask()">Add Task</button>
            </div>

            <ul id="taskList"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
